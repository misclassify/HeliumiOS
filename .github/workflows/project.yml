name: Helium
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.22.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Helium:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Helium
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: Websites you visit can ask to use the camera.
        NSMicrophoneUsageDescription: Websites you visit can ask to use the microphone.
        NSLocationWhenInUseUsageDescription: Websites you visit can ask for your location.
        CFBundleURLTypes:
          - CFBundleURLName: computer.helium.ios
            CFBundleURLSchemes: [helium]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.helium.ios.personal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
