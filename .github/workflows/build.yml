name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Helium.xcodeproj -scheme Helium \
            -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Helium.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          test -d build/Helium.xcarchive/Products/Applications/Helium.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Helium.xcarchive/Products/Applications/Helium.app Payload/
          zip -qry Helium.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Helium-ipa
          path: Helium.ipa
